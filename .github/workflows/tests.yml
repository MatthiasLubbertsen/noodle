name: tests

# not triggered on its own: docker.yml calls it first, so the images are only built and
# pushed when everything here is green. run it by hand from the actions tab if you want.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # same as the Dockerfile
          cache: pip
      - run: pip install -r requirements.txt
      # fake slack (web api + rtm websocket), handlers, text, reminders, sky, hackatime
      - run: python -m unittest discover -s tests -t .

  lint:
    name: lint (real bugs only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      # syntax errors, undefined names, broken comparisons: things that crash at runtime.
      # deliberately not style or unused imports.
      - run: ruff check --select E9,F63,F7,F82 .

  sandbox:
    name: sandbox syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: for f in sandbox/*.js; do node --check "$f"; done

  compose:
    name: compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # .env is gitignored but compose references it
      - run: touch .env && docker compose config -q
