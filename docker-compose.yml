services:
  noodle:
    # prebuilt by .github/workflows/docker.yml; `docker compose pull` fetches it,
    # `up --build` still builds locally from this checkout
    image: ghcr.io/matthiaslubbertsen/noodle:latest
    build: .
    container_name: noodle
    restart: unless-stopped
    # secrets come from the gitignored .env on the host (not baked into the image)
    env_file:
      - .env
    environment:
      # where the code sandbox lives on the internal network (see below). whether run_code is
      # offered at all depends only on SANDBOX_TOKEN being set in .env
      SANDBOX_URL: http://sandbox:8080
      # same for the browser (see below): offered only if BROWSER_TOKEN is set in .env
      BROWSER_URL: http://browser:8080
    # bind-mount so persisted state (noodle_memory.db, news "seen" state,
    # logs) survives `docker compose up -d --build`, not just a plain
    # restart - without this the container's writable layer (and everything
    # in it) is discarded every time the container gets recreated.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # default = internet (slack, the model api...); sandbox = the private link
    # to the code sandbox
    networks:
      - default
      - sandbox
      - browser

  # python + javascript code runner (wasm, see sandbox/ and AGENTS.md). it is
  # deliberately a separate container: it gets NONE of noodle's secrets, no
  # volumes and no internet - its only network is the internal one below, shared
  # with noodle alone, and nothing is published to the host.
  sandbox:
    image: ghcr.io/matthiaslubbertsen/noodle-sandbox:latest
    build: ./sandbox
    container_name: noodle-sandbox
    restart: unless-stopped
    environment:
      # the ONLY variable it gets (compose substitutes it from .env, the sandbox never sees the
      # rest of .env). SANDBOX_TOKEN empty/unset = the sandbox is OFF: this container then just
      # idles (no python loaded, almost no memory) and noodle doesn't offer run_code at all.
      # to turn it on, put 16+ random characters in .env: SANDBOX_TOKEN=...
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    networks:
      - sandbox
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5

  # headless chromium for the browser tool (see browser/ and AGENTS.md 7j). unlike the sandbox it
  # needs the internet, so it sits on TWO networks: `browser` (internal, shared with noodle alone,
  # how noodle talks to it) and `browser_egress` (a plain bridge it reaches the internet through,
  # which noodle and the sandbox are NOT on, so it can't see them). inside, chromium may only go
  # through an egress filter that refuses every private/loopback/link-local address, so the host
  # and the lan are out of reach too. it gets none of noodle's secrets and no volumes.
  browser:
    image: ghcr.io/matthiaslubbertsen/noodle-browser:latest
    build: ./browser
    container_name: noodle-browser
    restart: unless-stopped
    environment:
      # the ONLY variable it gets. empty/unset = the browser is OFF: the container idles (chromium
      # is never started) and noodle doesn't offer the browser tool. to turn it on put 16+ random
      # characters in .env: BROWSER_TOKEN=...
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}
    networks:
      - browser
      - browser_egress
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    shm_size: 256m

networks:
  browser:
    internal: true
  browser_egress: {}
  sandbox:
    # internal = no route to the internet or the host's network, only between
    # the containers attached to it
    internal: true
